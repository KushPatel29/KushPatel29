name: Profile

# This profile, the portfolio site and each repository's README are three front
# doors to the same work, and they have disagreed before. check_profile.py holds
# this page to the site's manifest: every project has a row, the three featured
# projects match the site's flagships, and no test totals creep back in.

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a green badge means the profile still matches the site now.
    - cron: "37 6 * * 3"

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The profile must match the portfolio's manifest
        run: python check_profile.py
